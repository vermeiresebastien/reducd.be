  <meta name="robots" id="robots-meta" content="index,follow">
  <link rel="canonical" id="canonical-link" href="https://www.reducd.be/blog/post.html">
  <meta property="og:type" content="article">
  <meta property="og:locale" content="nl_BE">
  <meta property="og:site_name" content="REDUCD">
  <meta property="og:title" id="og-title" content="Artikel — REDUCD">
  <meta property="og:description" id="og-description" content="Inzichten van REDUCD over akoestische omkastingen, warmtepompgeluid en stil wonen.">
  <meta property="og:url" id="og-url" content="https://www.reducd.be/blog/post.html">
  <script>
    (function () {
      var raw = new URLSearchParams(location.search).get("slug") || "";
      var slug = String(raw).trim();
      var canonical = document.getElementById("canonical-link");
      var ogUrl = document.getElementById("og-url");
      var robots = document.getElementById("robots-meta");
      if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/i.test(slug)) {
        if (robots) robots.setAttribute("content", "noindex,follow");
        return;
      }
      var url = "https://www.reducd.be/blog/post.html?slug=" + encodeURIComponent(slug.toLowerCase());
      if (canonical) canonical.href = url;
      if (ogUrl) ogUrl.setAttribute("content", url);
      document.title = slug.replace(/-/g, " ") + " — REDUCD";
    })();
  </script>

  <script src="../js/firebase-config.js"></script>
  <script type="module">
    import { getPostBySlug, listPublishedPosts } from "../js/firebase-app.js";
    import {
      getStaticPostBySlug,
      formatBlogDate,
      resolveCoverPath,
      escapeHtml,
      isHtmlContent,
      injectJsonLd,
      organizationJsonLd,
      blogPostingJsonLd,
      breadcrumbJsonLd,
      faqPageJsonLd,
      renderFaqHtml,
      renderPostCards
    } from "../js/blog-posts.js";

    const params = new URLSearchParams(location.search);
    const slug = params.get("slug");
    const status = document.getElementById("post-status");

    function setMeta(name, content) {
      let el = document.querySelector(`meta[name="${name}"]`);
      if (!el) {
        el = document.createElement("meta");
        el.setAttribute("name", name);
        document.head.appendChild(el);
      }
      el.setAttribute("content", content);
    }

    function setById(id, content) {
      const el = document.getElementById(id);
      if (el) el.setAttribute("content", content);
    }

    function renderPost(post) {
      if (!post) return;
      status.classList.add("hidden");
      document.getElementById("post-article").classList.remove("hidden");
      document.getElementById("post-cta").classList.remove("hidden");
      const title = post.metaTitle || `${post.title} — REDUCD`;
      const description = post.metaDescription || post.excerpt || "";
      const pageUrl = `https://www.reducd.be/blog/post.html?slug=${encodeURIComponent(post.slug)}`;
      document.title = title;
      setMeta("description", description);
      const canonical = document.getElementById("canonical-link");
      if (canonical) canonical.href = pageUrl;
      const coverAbs = post.coverImage
        ? `https://www.reducd.be/${String(post.coverImage).replace(/^\.\.\//, "").replace(/^\//, "")}`
        : "https://www.reducd.be/assets/images/promo-meer-rust.jpg";
      setById("og-title", title);
      setById("og-description", description);
      setById("og-url", pageUrl);
      setById("og-image", coverAbs);
      setById("twitter-title", title);
      setById("twitter-description", description);
      setById("twitter-image", coverAbs);
      document.getElementById("post-title").textContent = post.title || "";
      document.getElementById("post-excerpt").textContent = post.excerpt || "";
      document.getElementById("post-date").textContent = formatBlogDate(post.publishedAt) || "";
      const contentEl = document.getElementById("post-content");
      const html = isHtmlContent(post.content);
      contentEl.classList.toggle("plain", !html);
      const faqHtml = renderFaqHtml(post.faq);
      if (html) contentEl.innerHTML = (post.content || "") + faqHtml;
      else contentEl.textContent = post.content || "";
      if (!html && faqHtml) {
        const wrap = document.createElement("div");
        wrap.innerHTML = faqHtml;
        contentEl.after(wrap);
      }
      const cover = document.getElementById("post-cover");
      if (post.coverImage) {
        cover.classList.remove("hidden");
        const src = resolveCoverPath(post.coverImage, "blog");
        cover.innerHTML = `<img src="${escapeHtml(src)}" alt="${escapeHtml(post.title)}" class="w-full h-full object-cover">`;
      }
      injectJsonLd("ld-organization", organizationJsonLd());
      injectJsonLd("ld-article", blogPostingJsonLd(post, pageUrl, coverAbs));
      injectJsonLd("ld-breadcrumb", breadcrumbJsonLd(post, pageUrl));
      const faqLd = faqPageJsonLd(post.faq);
      if (faqLd) injectJsonLd("ld-faq", faqLd);
    }

    async function renderRelated(currentSlug) {
      try {
        const posts = (await listPublishedPosts()).filter((p) => p.slug !== currentSlug).slice(0, 2);
        if (!posts.length) return;
        document.getElementById("related-wrap").classList.remove("hidden");
        document.getElementById("related-grid").innerHTML = renderPostCards(posts, { from: "blog", heading: "h3" });
      } catch (err) {
        console.error(err);
      }
    }

    if (!slug) {
      status.textContent = "Artikel niet gevonden. Ga terug naar de blog.";
    } else {
      const instant = getStaticPostBySlug(slug);
      if (instant) renderPost(instant);
      try {
        const post = await getPostBySlug(slug);
        if (post && post.status !== "draft") {
          renderPost(post);
          await renderRelated(post.slug);
        } else if (!instant) {
          status.textContent = "Dit artikel is niet beschikbaar.";
        }
      } catch (err) {
        if (!instant) status.textContent = "Kon dit artikel niet laden.";
        console.error(err);
      }
    }
  </script>
</body>
